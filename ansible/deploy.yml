---
- name: Deploy Flask app with Docker
  hosts: web
  vars:
    docker_image: "{{ docker_image }}"
  tasks:
    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Remove old container
      command: docker rm -f myapp
      ignore_errors: true

    - name: Run new container
      command: docker run -d -p 80:5000 --name myapp {{ docker_image }}
